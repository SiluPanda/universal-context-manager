name: Bug report
description: Report a reproducible problem without attaching private context data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste credentials, private memories, database files, or full transcripts.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Core daemon, MCP adapter, Codex adapter, Claude Code adapter, Desktop app, Import/export]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps with synthetic data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
