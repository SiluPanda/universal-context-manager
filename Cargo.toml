[workspace]
members = [
  "crates/context-core",
  "crates/context-client",
  "crates/contextd",
  "crates/contextctl",
  "crates/context-mcp",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/context-core",
  "crates/context-client",
  "crates/contextd",
  "crates/contextctl",
  "crates/context-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
fs2 = "0.4"
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "serde_json", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
