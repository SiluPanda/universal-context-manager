[package]
name = "app"
version = "0.1.0"
description = "Universal Context Manager desktop control plane"
authors = ["Universal Context Manager contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { workspace = true }
context-client = { path = "../../../crates/context-client" }
context-core = { path = "../../../crates/context-core" }
log = "0.4"
rusqlite = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

[dev-dependencies]
tempfile = { workspace = true }
